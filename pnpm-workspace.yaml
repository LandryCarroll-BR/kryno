packages:
  - "apps/*"
  - "packages/*"
  - "modules/**/*"

catalog:
  "@effect/vitest": "4.1.1"
  "@turbo/gen": "^2.11.10"
  "@types/node": "^26.6.6"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "drizzle-kit": "1.0.0-rc.5"
  "drizzle-orm": "1.0.0-rc.5"
  "effect": "4.1.1"
  "next": "16.4.3"
  "react": "19.3.1"
  "react-dom": "19.3.1"
  "tailwindcss": "^4.3.3"
  "typescript": "^7.0.2"
  "vitest": "^5.0.5"

catalogs:
  pinned:
    "next": "^16.4.3"
    "react": "^19.3.1"
    "react-dom": "^19.3.1"
  typescript-5:
    "typescript": "5.9.3"

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  msw: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
